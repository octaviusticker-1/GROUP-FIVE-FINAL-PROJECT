
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="description"
        content="Welcome to Group Five — eight minds united by creativity, collaboration, and excellence.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"

    <link rel="stylesheet" href="css/style.css">

<body class="home-page">

    <!-- HEADER -->
    <header class="home-header">

        <div class="home-nav-container">

            <a href="index.html" class="home-brand">
                <span class="brand-g5">G5</span>
                <span class="brand-name">GROUP FIVE</span>
            </a>

            <nav class="home-navigation">
                <a href="index.html" class="current">Home</a>
                <a href="about.html">About Us</a>
                <a href="gallery.html">Gallery</a>
                <a href="contact.html">Contact</a>
            </nav>

        </div>

    </header>


    <!-- MAIN HERO -->
    <main class="home-hero">

        <div class="gold-decoration gold-decoration-top"></div>
        <div class="gold-decoration gold-decoration-bottom"></div>

        <div class="home-hero-container">

            <!-- LEFT: TEAMWORK LOGO -->
            <div class="hero-logo-area">

                <div class="team-emblem">

                    <!-- TEAMWORK SVG LOGO -->
                    <svg class="team-symbol" viewBox="0 0 500 370"
                        xmlns="http://www.w3.org/2000/svg"
                        role="img" aria-label="Five people joining together around G5">

                        <defs>
                            <linearGradient id="goldGradient" x1="0" y1="0" x2="1" y2="1">
                                <stop offset="0%" stop-color="#FFF0A6"/>
                                <stop offset="45%" stop-color="#E8B83F"/>
                                <stop offset="100%" stop-color="#A96A08"/>
                            </linearGradient>
                        </defs>

                        <!-- People heads -->
                        <circle cx="250" cy="43" r="27" fill="url(#goldGradient)"/>
                        <circle cx="115" cy="112" r="25" fill="url(#goldGradient)"/>
                        <circle cx="385" cy="112" r="25" fill="url(#goldGradient)"/>
                        <circle cx="72" cy="245" r="24" fill="url(#goldGradient)"/>
                        <circle cx="428" cy="245" r="24" fill="url(#goldGradient)"/>

                        <!-- People reaching toward the center -->
                        <path d="M145 80 Q250 105 355 80 L250 180 Z"
                            fill="url(#goldGradient)"/>

                        <path d="M93 139 Q135 110 175 116 L205 225 L25 190 Z"
                            fill="url(#goldGradient)"/>

                        <path d="M407 139 Q365 110 325 116 L295 225 L475 190 Z"
                            fill="url(#goldGradient)"/>

                        <path d="M48 270 Q100 205 180 220 L205 300 L30 325 Z"
                            fill="url(#goldGradient)"/>

                        <path d="M452 270 Q400 205 320 220 L295 300 L470 325 Z"
                            fill="url(#goldGradient)"/>

                        <!-- G5 center -->
                        <text x="250" y="260"
                            text-anchor="middle"
                            font-family="Inter, Arial, sans-serif"
                            font-size="112"
                            font-weight="900"
                            fill="url(#goldGradient)"
                            stroke="#A96A08"
                            stroke-width="2">G5</text>

                        <!-- Gold base -->
                        <path d="M35 335 Q250 275 465 335"
                            fill="none"
                            stroke="url(#goldGradient)"
                            stroke-width="13"
                            stroke-linecap="round"/>

                    </svg>

                    <h1 class="emblem-title">GROUP FIVE</h1>

                    <div class="emblem-tagline">
                        <span></span>
                        ONE TEAM. ONE VISION.
                        <span></span>
                    </div>

                </div>

            </div>


            <!-- RIGHT: HERO TEXT -->
            <div class="hero-content">

                <span class="welcome-label">
                    WELCOME TO GROUP FIVE
                </span>

                <h2>
                    Eight Minds.<br>
                    <span>One Vision.</span><br>
                    Endless Possibilities.
                </h2>

                <p class="hero-description">
                    We are Group Five — a team of eight, united by
                    creativity, collaboration, and a shared
                    commitment to excellence.
                </p>

                <a href="about.html" class="hero-button">
                    Learn More
                    <span>&rarr;</span>
                </a>
